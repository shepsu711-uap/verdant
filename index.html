let state={version:1,notes:[],settings:{light:false,reduce:false,spell:true,lang:'en-US',transcribe:true,captureLayout:'compact'},alarms:[],timer:null,stopwatch:{elapsed:0,start:null,laps:[]},zones:['America/New_York','Europe/London','Asia/Tokyo']};
let db,ready=false,storageOK=true,view='capture',filter='all',query='',searchOpen=false,selectedDay=dayKey(Date.now()),calMonth=new Date(new Date().getFullYear(),new Date().getMonth(),1),clockTab='timer',activeNote=null,saveChain=Promise.resolve(),toastHandle,objectURLs=[],previousFocus=null,captureDay=dayKey(Date.now()),calendarMethod='all',calendarPeriod='all',calendarExpanded=false,groupOrigin=null,mediaBusy=false;
let editSaveTimer=null,editDirty=false;

// STORAGE ADAPTER: init/get/set/del/keys (+ optional batch). Local IndexedDB is active; a shared cloud backend can implement the same interface later.
const DB_NAME='verdant-capture-v1',DB_VERSION=2,STORES=['app','notes','media','meta'];
const idbReq=r=>new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const LocalAdapter={name:'local',db:null,
 async init(){this.db=await new Promise((resolve,reject)=>{const r=indexedDB.open(DB_NAME,DB_VERSION);r.onupgradeneeded=()=>{for(const s of STORES)if(!r.result.objectStoreNames.contains(s))r.result.createObjectStore(s)};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);r.onblocked=()=>reject(Error('Storage is open in another tab'))});this.db.onversionchange=()=>this.db.close();return this},
 get(store,key){return idbReq(this.db.transaction(store).objectStore(store).get(key))},
 keys(store){return idbReq(this.db.transaction(store).objectStore(store).getAllKeys())},
 set(store,key,val){return this.batch([{store,key,val}])},
 del(store,key){return this.batch([{store,key,del:true}])},
 batch(ops){if(!ops.length)return Promise.resolve(true);const names=[...new Set(ops.map(o=>o.store))];let tx;try{tx=this.db.transaction(names,'readwrite',{durability:'strict'})}catch(e){tx=this.db.transaction(names,'readwrite')}const done=new Promise((res,rej)=>{tx.oncomplete=()=>res(true);tx.onerror=()=>rej(tx.error||Error('Save failed'));tx.onabort=()=>rej(tx.error||Error('Save aborted'))});try{for(const o of ops){const s=tx.objectStore(o.store);o.del?s.delete(o.key):s.put(o.val,o.key)}}catch(e){try{tx.abort()}catch(_){}}return done}};
/* Placeholder for the shared cloud account (BlockForm · TRACE · Verdant). Not enabled. */
const CloudAdapter={name:'cloud',enabled:false,async init(){throw Error('Cloud storage is not enabled')},async get(){},async set(){},async del(){},async keys(){return[]}};
let storage=LocalAdapter;
async function storageBatch(ops){if(storage.batch)return storage.batch(ops);for(const o of ops)o.del?await storage.del(o.store,o.key):await storage.set(o.store,o.key,o.val);return true}
const META_KEYS=['version','settings','alarms','timer','stopwatch','zones'];
function metaRecord(src=state){const o={};for(const k of META_KEYS)o[k]=src[k];return o}
function noteRecord(n){const {media,...rest}=n;return{...rest,media:(media||[]).map(m=>({id:m.id,name:m.name,type:m.type,size:mediaSize(m)}))}}
let savedNotes=new Map(),savedMedia=new Set(),savedMeta='';
function noteOps(notes,ops,verify){for(const n of notes){const rec=noteRecord(n);ops.push({store:'notes',key:n.id,val:rec});verify.notes.push([n.id,JSON.stringify(rec)])}}
async function verifyWrites(v){for(const [id,fp] of v.notes){const r=await storage.get('notes',id);if(!r||JSON.stringify(r)!==fp)throw Error('Note did not read back')}for(const [id,size] of v.media){const r=await storage.get('media',id);if(!r||(r.bytes?.byteLength??-1)!==size)throw Error('Media did not read back')}}
function showSaveWarning(on){const b=$('#saveBanner');if(b)b.classList.toggle('hidden',!on)}
async function migrateV1(){const old=await storage.get('app','state');if(!old)return{unreadable:0};if(await storage.get('meta','migratedV1')){await storage.del('app','state');return{unreadable:0}}
 const s={...state,...old,settings:{...state.settings,...(old.settings||{})}};s.notes=Array.isArray(s.notes)?s.notes:[];let unreadable=0;const ops=[],v={notes:[],media:[]};
 for(const n of s.notes){n.id=n.id||uid();n.media=n.media||[];for(const m of n.media){m.id=m.id||uid();try{await stabilizeMedia(m);ops.push({store:'media',key:m.id,val:{id:m.id,type:m.type,bytes:m.bytes}});v.media.push([m.id,m.bytes.byteLength])}catch(e){unreadable++}}}
 noteOps(s.notes,ops,v);ops.push({store:'meta',key:'state',val:metaRecord(s)});await storageBatch(ops);await verifyWrites(v);
 await storageBatch([{store:'meta',key:'migratedV1',val:{at:Date.now(),notes:s.notes.length,media:v.media.length}}]);await storageBatch([{store:'app',key:'state',del:true}]);return{unreadable}}
async function loadAll(){const meta=await storage.get('meta','state');if(meta){state={...state,...meta,settings:{...state.settings,...(meta.settings||{})}};savedMeta=JSON.stringify(meta)}const notes=[];for(const k of await storage.keys('notes')){const r=await storage.get('notes',k);if(!r)continue;const media=[];for(const mm of r.media||[]){const b=await storage.get('media',mm.id);if(b?.bytes){media.push({id:mm.id,name:mm.name,type:mm.type,bytes:b.bytes});savedMedia.add(mm.id)}else media.push({id:mm.id,name:mm.name,type:mm.type})}notes.push({...r,media});savedNotes.set(r.id,JSON.stringify(r))}state.notes=notes.sort((a,b)=>b.created-a.created)}
async function initDB(){let migration={unreadable:0},failed=false;try{await storage.init();db=storage.db;try{navigator.storage?.persist?.().catch(()=>{})}catch(e){}try{migration=await migrateV1()}catch(e){failed=true;const old=await storage.get('app','state').catch(()=>null);if(old)state={...state,...old,settings:{...state.settings,...(old.settings||{})}}}if(!failed)await loadAll();const m2=await migrateArchive();migration.unreadable+=m2.unreadable;ready=true;applySettings();render();tick();if(failed){storageOK=false;showSaveWarning(true);toast('Could not upgrade storage. Your old data is untouched; export a backup.')}else if(m2.changed)persist();if(migration.unreadable)toast('Some older media could not be read. Their entries are preserved; reattach originals if needed.')}catch(e){ready=true;storageOK=false;applySettings();render();showSaveWarning(true);toast('Device storage is unavailable. Export a backup before closing.')}}
async function writeChanges(){if(!db)return false;try{const ops=[],v={notes:[],media:[]},next=new Map(),aliveMedia=new Set();const changed=[];for(const n of state.notes){const fp=JSON.stringify(noteRecord(n));next.set(n.id,fp);if(savedNotes.get(n.id)!==fp)changed.push(n);for(const m of n.media){if(!m.bytes&&!m.blob){if(savedMedia.has(m.id))aliveMedia.add(m.id);continue}aliveMedia.add(m.id);if(!savedMedia.has(m.id)){await stabilizeMedia(m);ops.push({store:'media',key:m.id,val:{id:m.id,type:m.type,bytes:m.bytes}});v.media.push([m.id,m.bytes.byteLength])}}}noteOps(changed,ops,v);for(const id of savedNotes.keys())if(!next.has(id))ops.push({store:'notes',key:id,del:true});for(const id of savedMedia)if(!aliveMedia.has(id))ops.push({store:'media',key:id,del:true});const meta=JSON.stringify(metaRecord());if(meta!==savedMeta)ops.push({store:'meta',key:'state',val:metaRecord()});await storageBatch(ops);await verifyWrites(v);savedNotes=next;savedMedia=aliveMedia;savedMeta=meta;return true}catch(e){return false}}
function persist(){if(!ready)return Promise.resolve(false);if($('#saveStatus'))$('#saveStatus').textContent='Saving…';const wasOK=storageOK;saveChain=saveChain.catch(()=>false).then(writeChanges).then(ok=>{storageOK=ok;setSaveStatus();showSaveWarning(!ok);if(!ok&&wasOK)toast('Could not save. Export a backup from Settings before closing.');return ok});return saveChain}
function setSaveStatus(){if($('#saveStatus')){$('#saveStatus').textContent=storageOK?'Saved on device':'Not saved · export backup';$('#saveStatus').classList.toggle('save-warning',!storageOK)}}
function applySettings(){document.body.classList.toggle('light',state.settings.light);document.body.classList.toggle('reduce',state.settings.reduce);document.querySelector('meta[name=theme-color]').content=state.settings.light?'#eef3eb':'#0c1410'}
const mediaURLs=new Map(),imageSources=new WeakMap();
function mediaBlob(m){if(m.bytes instanceof ArrayBuffer||ArrayBuffer.isView(m.bytes))return new Blob([m.bytes],{type:m.type});if(m.blob instanceof Blob)return m.blob;throw Error('Media bytes unavailable')}

async function stabilizeMedia(m){if(m.bytes)return false;if(!(m.blob instanceof Blob))throw Error('Missing media');const bytes=await m.blob.arrayBuffer();if(bytes.byteLength!==m.blob.size)throw Error('Incomplete media');m.bytes=bytes;delete m.blob;return true}
function normalizeStopwatch(){const s=state.stopwatch;s.sessionId=s.sessionId||uid();s.finished=!!s.finished;s.laps=s.laps.map((lap,i)=>typeof lap==='number'?{id:uid(),totalMs:lap,at:null,noteId:null}:lap);return s}
async function migrateArchive(){let changed=false,unreadable=0;normalizeStopwatch();for(const n of state.notes)for(const m of n.media){m.id=m.id||uid();try{changed=await stabilizeMedia(m)||changed}catch(e){unreadable++}}return{changed,unreadable}}
function mediaMarkup(n,m,tag='img',cls=''){return `<${tag} class="${cls} media-loading" data-media-owner="${esc(n.id)}" data-media-key="${esc(m.id)}" ${tag==='img'?`alt="${esc(m.name)}" loading="lazy"`:'controls playsinline preload="metadata"'}>${tag==='img'?'':`</${tag}>`}`}
function hydrateMedia(root=document){for(const el of root.querySelectorAll('[data-media-key]')){if(el.dataset.hydrating)continue;el.dataset.hydrating='true';const n=state.notes.find(n=>n.id===el.dataset.mediaOwner),m=n?.media.find(m=>m.id===el.dataset.mediaKey);if(!m)continue;let fallback=false;const failed=()=>{if(!el.isConnected)return;el.classList.remove('media-loading');if(el.tagName==='IMG'){el.removeAttribute('src');el.alt='Preview unavailable';}const msg=document.createElement('p');msg.className='media-error';msg.textContent='Preview unavailable. Try downloading the original, or reattach it if its saved data is unreadable.';el.insertAdjacentElement('afterend',msg)};el.onerror=async()=>{if(fallback)return failed();fallback=true;try{const source=await dataURL(mediaBlob(m));if(el.isConnected){el.src=source;if(el.tagName!=='IMG')el.load()}}catch(e){failed()}};el.onload=el.onloadedmetadata=()=>el.classList.remove('media-loading');try{if(el.tagName==='IMG'){let promise=imageSources.get(m);if(!promise){promise=dataURL(mediaBlob(m));imageSources.set(m,promise)}promise.then(url=>{if(el.isConnected)el.src=url}).catch(failed)}else el.src=addURL(m)}catch(e){failed()}}}

function hideOverlays(){const wasDrawer=!$('#drawer').classList.contains('hidden');$('#drawer').classList.add('hidden');$('#captureMenu').classList.add('hidden');$('#scrim').classList.add('hidden');$('#plusBtn').classList.remove('open');$('#plusBtn').setAttribute('aria-expanded','false');$('#menuBtn').setAttribute('aria-expanded','false');if(wasDrawer)$('#menuBtn').focus()}
function go(next){hideOverlays();view=next;render();window.scrollTo(0,0)}
function render(){if(!ready)return;const titles={capture:['A little space for everything','Capture'],calendar:['A trace of your days','Calendar'],clock:['Give time a little shape','Clock'],settings:['Make this space yours','Settings']};$('#eyebrow').textContent=titles[view][0];$('#pageTitle').textContent=titles[view][1];$('#searchBtn').classList.toggle('hidden',view!=='capture');$('#drawerCount').textContent=`${state.notes.length} capture${state.notes.length===1?'':'s'}`;$('#nav').innerHTML=[['capture','note','Captures'],['calendar','calendar','Calendar'],['clock','clock','Clock'],['settings','settings','Settings']].map(([v,i,t])=>`<button data-nav="${v}" class="${view===v?'active':''}">${ico(i)}${t}</button>`).join('');if(view==='capture')renderCapture();if(view==='calendar')renderCalendar();if(view==='clock')renderClock();if(view==='settings')renderSettings();hydrateMedia();releaseURLs()}
function getNotes(){return [...state.notes].sort((a,b)=>(!!b.pinned-!!a.pinned)||(b.updated-a.updated))}
const periods=[{id:'morning',name:'Morning',hours:'5 am – 11 am',icon:'sun'},{id:'midday',name:'Midday',hours:'11 am – 2 pm',icon:'sun'},{id:'afternoon',name:'Afternoon',hours:'2 pm – 6 pm',icon:'sun'},{id:'night',name:'Night',hours:'6 pm – 5 am',icon:'clock'}];
const methods=[{id:'text',name:'Text',icon:'note',color:'#b7efb2'},{id:'photo',name:'Photo',icon:'image',color:'#7ebdaf'},{id:'voice',name:'Voice',icon:'wave',color:'#e0ce91'},{id:'video',name:'Video',icon:'video',color:'#93aed4'},{id:'stopwatch',name:'Stopwatch',icon:'clock',color:'#c3a1cc'}];
function periodOf(at){const h=new Date(at).getHours();return h>=5&&h<11?'morning':h>=11&&h<14?'midday':h>=14&&h<18?'afternoon':'night'}
function methodsOf(n){const ids=[];if(plain(n.html).trim()||(!n.media.length&&!n.timing))ids.push('text');if(n.media.some(m=>m.type.startsWith('image/')))ids.push('photo');if(n.media.some(m=>m.type.startsWith('audio/')))ids.push('voice');if(n.media.some(m=>m.type.startsWith('video/')))ids.push('video');if(n.timing)ids.push('stopwatch');return ids}
function methodStats(notes){const counts=Object.fromEntries(methods.map(m=>[m.id,0]));for(const n of notes)for(const id of methodsOf(n))counts[id]++;const uses=Object.values(counts).reduce((a,b)=>a+b,0);return{counts,uses,total:notes.length}}
function noteIcon(n){return n.timing?'clock':n.media.some(m=>m.type.startsWith('audio/'))?'wave':n.media.some(m=>m.type.startsWith('image/'))?'image':n.media.some(m=>m.type.startsWith('video/'))?'video':'note'}
function matchesFilter(n){const ids=methodsOf(n);return(filter==='all'||filter==='pinned'&&n.pinned||filter==='notes'&&ids.includes('text')||filter==='voice'&&ids.includes('voice')||filter==='photo'&&ids.includes('photo')||filter==='video'&&ids.includes('video')||filter==='stopwatch'&&ids.includes('stopwatch'))&&(`${n.title} ${plain(n.html)}`.toLowerCase().includes(query.toLowerCase()))}

heck="${state.settings.spell}" autocorrect="on" autocapitalize="sentences" data-placeholder="Start anywhere…">${cleanHTML(n.html)}</div><div class="attachments" id="attachments"></div><section class="recorder ${voice?'':'hidden'}" id="recorder"><div class="row between"><span class="mono muted" id="recLabel">Voice capture</span><span class="record-time" id="recordTime">00:00</span></div><canvas class="wave" id="waveCanvas" width="600" height="140" aria-label="Microphone volume visualization"></canvas><div class="row between" id="recordOptions"><label class="check-line small"><input type="checkbox" id="autoTranscript" ${state.settings.transcribe?'checked':''}>Live transcription</label><span class="small muted">${esc(state.settings.lang)}</span></div><p class="small muted" id="speechHint" style="margin:10px 0">Transcription uses your browser’s speech service and may send speech to its provider. Audio is kept on this device. Keep this page open while recording.</p><div class="row"><button class="primary grow" id="startRecording">Start recording</button><button class="secondary grow hidden" id="stopRecording"><span class="stop-square"></span>Stop & save</button></div><div id="liveTranscript" class="live-transcript" aria-live="polite"></div></section></div><div class="sheet-footer"><div class="row" style="gap:2px"><button class="icon" id="attachNote" aria-label="Attach image or video">${ico('image')}</button><button class="icon" id="voiceNote" aria-label="Open voice recorder">${ico('mic')}</button></div><button class="icon danger" id="deleteNote" aria-label="Delete note">${ico('trash')}</button></div></section>`);updateWordCount();drawIdle();renderAttachments();setSaveStatus();$('#noteTitle').oninput=()=>syncEditor(false);$('#noteEditor').oninput=()=>syncEditor(false);$('#noteEditor').onpaste=e=>{e.preventDefault();document.execCommand('insertText',false,e.clipboardData.getData('text/plain'));syncEditor()};$('#pinNote').onclick=()=>{n.pinned=!n.pinned;$('#pinNote').setAtt async function importMedia(files){if(mediaBusy)return toast('An attachment is still being saved.');if(!files.length)return;if(!activeNote)newNote();const n=activeNote;mediaBusy=true;toast('Saving attachment…');try{for(const f of files){if(!/^(image|video)\//.test(f.type)){toast('Choose an image or video file.');continue}if(f.size>100*1024*1024){toast('Choose a file smaller than 100 MB.');continue}const bytes=await f.arrayBuffer();if(bytes.byteLength!==f.size)throw Error('Incomplete attachment');n.media.push({id:uid(),name:f.name,type:f.type,bytes})}n.updated=Date.now();const saved=await persist();if(activeNote?.id===n.id)renderAttachments();toast(saved?'Attachment saved on device.':'Attachment is in memory. Export a backup before closing.')}catch(e){toast('Could not read that attachment. Please select the original again.')}finally{mediaBusy=false}}

function openCamera(){hideOverlays();openModal(`<section class="sheet"><div class="sheet-header"><h3>Keep what you see.</h3><button class="icon" data-close aria-label="Close camera options">${ico('close')}</button></div><div class="sheet-body stack"><button class="secondary row" id="takePhoto">${ico('camera')}Take a picture</button><button class="secondary row" id="takeVideo">${ico('video')}Record a video</button><p class="small muted">Your device opens its camera or media picker. The result becomes a capture.</p></div></section>`,'Camera options');$('#takePhoto').onclick=()=>{closeModal();$('#cameraPhoto').click()};$('#takeVideo').onclick=()=>{closeModal();$('#cameraVideo').click()}}

function releaseIdleWake(){if(!recording&&!state.timer?.end&&wake){wake.release().catch(()=>{});wake=null}}
// VOICE: MediaRecorder keeps audio; SpeechRecognition independently adds text.
async function startRecording(){if(recording||recordStarting||recordStopping)return;if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){toast('Microphone recording is unavailable here. Try a secure browser preview, or use keyboard dictation.');return}recordStarting=true;$('#startRecording').disabled=true;$('#startRecording').textContent='Opening microphone…';let localStream;try{await audioReady();localStream=await navigator.mediaDevices.getUserMedia({audio:true});stream=localStream;const formats=['audio/mp4','audio/webm;codecs=opus','audio/webm','audio/ogg;codecs=opus'];const mime=formats.find(t=>MediaRecorder.isTypeSupported(t));const rec=new MediaRecorder(stream,mime?{mimeType:mime}:undefined);const chunks=[];const target=activeNote;rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};rec.onerror=()=>{toast('Recording interrupted. Saving available audio.');stopRecording()};rec.onstop=async()=>{recordStopping=true;try{const blob=new Blob(chunks,{type:rec.mimeType||mime||'audio/mp4'});if(blob.size){const extension=blob.type.includes('mp4')?'m4a':blob.type.includes('ogg')?'ogg':'webm';target.media.push({id:uid(),name:'Voice-'+new Date().toISOString().replace(/[:.]/g,'-')+'.'+extension,type:blob.type,bytes:await blob.arrayBuffer()});target.updated=Date.now();const saved=await persist();toast(saved?'Recording saved. Any captured transcript is editable in your note.':'Recording kept in memory. Export a backup now.')}else toast('No audio was captured. Try again.')}catch(e){const rescue=new Blob(chunks,{type:rec.mimeType||mime||'audio/mp4'});if(rescue.size){target.media.push({id:uid(),name:'Voice-recovery',type:rescue.type,blob:rescue});await persist()}toast('Audio needs recovery. Try downloading the saved attachment.')}recordStopping=false;cleanupRecording();if(activeNote?.id===target.id){renderAttachments();$('#recLabel').textContent='Voice capture';$('#recordOptions').classList.remove('hidden');$('#startRecording').classList.remove('hidden');$('#sta function startSpeech(target){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return;let denied=false,ends=0;const r=new SR();recognition=r;r.lang=state.settings.lang;r.continuous=true;r.interimResults=true;r.onresult=e=>{let interim='';for(let i=e.resultIndex;i<e.results.length;i++){const text=e.results[i][0].transcript;if(e.results[i].isFinal){if(activeNote?.id===target.id&&$('#noteEditor')){const p=document.createElement('p');p.textContent=text;$('#noteEditor').appendChild(p);syncEditor()}else{target.html+='<p>'+esc(text)+'</p>';persist()}}else interim+=text}if($('#liveTranscript'))$('#liveTranscript').textContent=interim||'Listening…'};r.onerror=e=>{if(['not-allowed','service-not-allowed','audio-capture','network','language-not-supported'].includes(e.error)){denied=true;if($('#liveTranscript'))$('#liveTranscript').textContent='Transcription is unavailable ('+e.error+'). Audio is still recording; use keyboard dictation or add text later.'}};r.onend=()=>{if(recording?.state==='recording'&&!denied&&++ends<30){setTimeout(()=>{if(recording?.state==='recording'){try{r.start()}catch(e){}}},300)}};try{r.start();$('#liveTranscript').textContent='Listening…'}catch(e){$('#liveTranscript').textContent='Live transcription could not start. Your audio is still recording.'}}

function renderSettings(){const s=state.settings,total=state.notes.reduce((sum,n)=>sum+n.media.reduce((a,m)=>a+mediaSize(m),0),0);$('#view').innerHTML=`<section class="section stack"><div class="settings-card"><div class="setting row between"><div class="grow"><h3>Daylight</h3><p>A soft, pale-green canvas.</p></div><input type="checkbox" id="lightSetting" aria-label="Daylight theme" ${s.light?'checked':''}></div><div class="setting row between"><div class="grow"><h3>Quiet motion</h3><p>Reduce transitions and decorative movement.</p></div><input type="checkbox" id="motionSetting" aria-label="Reduce motion" ${s.reduce?'checked':''}></div><div class="setting row between"><div class="grow"><h3>Writing assistance</h3><p>Use your device’s spelling and autocorrect. Grammar suggestions depend on your keyboard and browser.</p></div><input type="checkbox" id="spellSetting" aria-label="Writing assistance" ${s.spell?'checked':''}></div></div><div class="settings-card"><div class="setting row between"><div class="grow"><h3>Live transcription</h3><p>Try automatic speech-to-text with each recording. Your browser’s speech provider may process audio online.</p></div><input type="checkbox" id="transcribeSetting" aria-label="Automatic transcription" ${s.transcribe?'checked':''}></div><div class="setting row between"><label for="languageSetting" class="grow"><h3>Speaking language</h3><p>For transcription and dictation.</p></label><select id="languageSetting">${[['en-US','English (US)'],['en-GB','English (UK)'],['es-ES','Español'],['fr-FR','Français'],['de-DE','Deutsch'],['pt-BR','Português'],['ar-SA','العربية'],['zh-CN','中文'],['ja-JP','日本語']].map(([v,t])=>`<option value="${v}" ${s.lang===v?'selected':''}>${t}</option>`).join('')}</select></div></div><div class="settings-card stack"><div><h3>Your archive</h3><p class="small muted" style="margin-top:6px">${state.notes.length} captures · ${(total/1048576).toFixed(1)} MB of media<br>${storageOK?'Saving on this device.':'Storage unavailable — export before closing.'}</p></div><p class="small muted">Captures live in this browser or Web IDE preview, not inside the HTML. Clearing browser data or changing preview addresses can remove access. Export a backup to keep text, photos, audio, and clock settings together.</p><div class="row" style="flex-wrap:wrap"><button class="secondary" id="backupBtn">Export full backup</button><button class="secondary" id="restoreBtn">Import backup</button></div><p class="small muted">Import merges by capture: new ones are added, newer versions update, duplicates are skipped. Clock settings stay intact.</p></div><div class="settings-card help"><details><summary>Getting started & device support</summary><p class="small muted">Save this file as Verdant.html, open it in Web IDE, and run its preview. Nothing needs installing. Notes, media playback, calendars, and clock tools work without an app server.</p><ul><li><b>Capture:</b> tap + for images, camera, notes, voice or clock tools. Notes save as you type.</li><li><b>Day grid:</b> captures on a local date group into morning (5–11), midday (11–14), afternoon (14–18), and night (18–5). Each time section shows 1–4 captures as large preview cards. At 5 captures, that section folds into a four-quadrant folder; tap it to see everything. Removing captures or filtering back to 4 or fewer restores large previews. Choose Cards for the full archive.</li><li><b>Calendar:</b> the daily chart shows capture counts and content methods. Tap a segment or method to reveal matching captures grouped by time of day. A capture can contain multiple methods; percentages are shares of all method uses.</li><li><b>Write:</b> select text, then choose bold, italic, underline, heading or list. Red spelling underlines come from your device.</li><li><b>Voice:</b> start a recording and allow the microphone. Bars respond to actual microphone volume. Stop & save adds an audio player; finalized transcription appears as editable paragraphs.</li><li><b>Compatibility:</b> microphone access requires a secure preview and permission. Embedded iPhone Web IDE previews may restrict it. If needed, open the same preview in Safari. Live transcription also depends on browser support, device settings and sometimes internet. When unavailable, use the iPhone keyboard microphone inside a note. There is no built-in cloud transcription or transcription of uploaded files.</li><li><b>Recording:</b> stay on this page until Stop & save finishes. A locked phone or closing the page can interrupt and lose an unfinished recording.</li><li><b>Clock:</b> one countdown, a stopwatch with interval laps, cumulative totals, pause, stop, and captures for activities or distractions, daily or one-time alarms, and world clocks. Time is calculated from timestamps so it catches up after backgrounding. Alerts cannot reliably wake a locked phone. Open a Clock control first to enable sound.</li><li><b>Media:</b> native camera/picker behavior varies. Some HEIC or video formats may not preview; the original remains downloadable. Each imported media file is limited to 100 MB.</li><li><b>Privacy:</b> this file has no analytics or application server. Browser dictation and spelling services follow your device’s policies. Backups are unencrypted — keep them somewhere private.</li></ul><p class="small"><a href="https://developer.mozilla.org/en-US/docs/Web/API/SpeechRecognition" target="_blank" rel="noopener">Speech support</a> · <a href="https://developer.mozilla.org/en-US/docs/Web/API/MediaDevices/getUserMedia" target="_blank" rel="noopener">Microphone access</a> · <a href="https://developer.mozilla.org/en-US/docs/Web/API/Page_Visibility_API" target="_blank" rel="noopener">Background limits</a></p></details></div><p class="mono muted" style="padding:10px 0">VERDANT / V1.2 · ONE FILE, A LITTLE SPACE</p></section>`;for(const [id,key] of [['lightSetting','light'],['motionSetting','reduce'],['spellSetting','spell'],['transcribeSetting','transcribe']])$('#'+id).onchange=e=>{s[key]=e.target.checked;applySettings();persist()};$('#languageSetting').onchange=e=>{s.lang=e.target.value;persist()};$('#backupBtn').onclick=exportBackup;$('#restoreBtn').onclick=()=>$('#restoreInput').click()}
function safeName(name){return name.replace(/[^\p{L}\p{N} _.-]/gu,'').trim().slice(0,80)||'Capture'}
function download(blob,name){const a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000)}
const dataURL=b=>new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(r.error);r.readAsDataURL(b)});
// PORTABILITY: turn stored media bytes into base64 for portable backups; old backups remain supported.
async function exportBackup(){const b=$('#backupBtn');if(b){b.disabled=true;b.textContent='Packing archive…'}try{const copy=structuredClone(state);for(const n of copy.notes)for(const m of n.media){m.data=await dataURL(mediaBlob(m));delete m.blob;delete m.bytes}download(new Blob([JSON.stringify({app:'verdant',version:1,exported:new Date().toISOString(),state:copy})],{type:'application/json'}),'Verdant-backup-'+dayKey(Date.now())+'.json');toast('Backup ready. Save the downloaded file somewhere safe.')}catch(e){toast('Backup could not be created. Try exporting individual attachments.')}finally{if(b){b.disabled=false;b.textContent='Export full backup'}}}
async function restoreBackup(file){if(!file)return;if(file.size>250*1048576)return toast('This backup is too large to import here (250 MB maximum).');try{const b=JSON.parse(await file.text());if(b.app!=='verdant'||b.version!==1||!Array.isArray(b.state?.notes))throw Error('format');const incoming=[];for(const n of b.state.notes){if(typeof n.html!=='string'||typeof n.title!=='string'||!Array.isArray(n.media)||!Number.isFinite(n.created)||!Number.isFinite(n.updated))throw Error('capture');const media=[];for(const m of n.media){if(!/^(image|audio|video)\//.test(m.type)||typeof m.data!=='string'||!m.data.startsWith('data:'+m.type+';base64,'))throw Error('media');const binary=atob(m.data.split(',')[1]),bytes=new Uint8Array(binary.length);for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);media.push({id:typeof m.id==='string'&&m.id?m.id:uid(),name:String(m.name||'Attachment'),type:m.type,bytes:bytes.buffer})}incoming.push({id:typeof n.id==='string'&&n.id?n.id:uid(),title:n.title.slice(0,200),html:cleanHTML(n.html),created:n.created,updated:n.updated,pinned:!!n.pinned,media,...(n.timing&&Number.isFinite(n.timing.durationMs)&&n.timing.durationMs>=0?{timing:{...n.timing}}:{})})}const seen=new Set(),plan={add:[],update:[],skip:0};for(const n of incoming){if(seen.has(n.id)){plan.skip++;continue}seen.add(n.id);const i=state.notes.findIndex(x=>x.id===n.id);if(i<0)plan.add.push(n);else if(n.updated>state.notes[i].updated)plan.update.push([i,n]);else plan.skip++}if(!incoming.length)return toast('This backup contains no captures.');if(!plan.add.length&&!plan.update.length)return toast(`Everything in this backup is already here (${plan.skip} skipped).`);if(!confirm(`Import ${plan.add.length} new and update ${plan.update.length} changed captures? ${plan.skip} already here will be skipped.`))return;for(const [i,n] of plan.update)state.notes[i]=n;state.notes.push(...plan.add);const saved=await persist();render();toast(saved?`${plan.add.length} added · ${plan.update.length} updated · ${plan.skip} skipped.`:'Imported into memory. Device storage could not save them.')}catch(e){toast('This is not a valid Verdant backup, or the file is damaged.')}}

document.addEventListener('click',e=>{const segment=e.target.closest('circle[data-chart-method]');if(segment){selectDayChart(segment.dataset.chartMethod,'all');return}const b=e.target.closest('button');if(!b)return;if(b.dataset.nav)go(b.dataset.nav);if(b.hasAttribute('data-close'))closeModal();if(b.dataset.note)openEditor(b.dataset.note);if(b.dataset.filter){filter=b.dataset.filter;render()}if(b.dataset.day){selectedDay=b.dataset.day;calendarExpanded=false;calendarMethod=calendarPeriod='all';render()}if(b.dataset.layout){state.settings.captureLayout=b.dataset.layout;persist();render()}if(b.dataset.captureDay){const d=new Date(captureDay+'T12:00:00');d.setDate(d.getDate()+Number(b.dataset.captureDay));captureDay=dayKey(d);render()}if(b.dataset.group)openGroup(b.dataset.group,b.dataset.groupDay);if(b.dataset.timingCapture)openTimingCapture(b.dataset.timingCapture);if(b.dataset.chartMethod)selectDayChart(b.dataset.chartMethod,'all');if(b.dataset.chartPeriod)selectDayChart('all',b.dataset.chartPeriod);if(b.id==='hideDayCaptures'){calendarExpanded=false;$('#dailyInsights').innerHTML=dailyInsights(selectedDay)}if(b.dataset.clockTab){clockTab=b.dataset.clockTab;renderClock()}if(b.dataset.add){const action=b.dataset.add;hideOverlays();if(action==='upload')$('#uploadInput').click();if(action==='camera')openCamera();if(action==='note'||action==='voice')newNote(action);if(action==='clock'){clockTab='timer';go('clock')}}});
for(const id of ['uploadInput','cameraPhoto','cameraVideo'])$('#'+id).onchange=async e=>{const files=[...e.target.files];e.target.value='';await importMedia(files)};$('#restoreInput').onchange=async e=>{const file=e.target.files[0];e.target.value='';await restoreBackup(file)};
